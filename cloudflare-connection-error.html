<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rolespace — Server Unavailable</title>
  <link rel="icon" href="https://rolespace.net/images/icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      background: #0a0a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* ── Animated background grid ── */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* ── Floating orbs ── */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particles span {
      position: absolute;
      border-radius: 50%;
      animation: float-particle 14s infinite ease-in-out;
    }
    .particles span:nth-child(1) { width: 200px; height: 200px; top: 5%; left: 0%; background: radial-gradient(circle, rgba(124,92,224,0.08) 0%, transparent 70%); animation-delay: 0s; }
    .particles span:nth-child(2) { width: 150px; height: 150px; top: 55%; right: 5%; background: radial-gradient(circle, rgba(167,139,250,0.06) 0%, transparent 70%); animation-delay: -3s; }
    .particles span:nth-child(3) { width: 100px; height: 100px; bottom: 10%; left: 10%; background: radial-gradient(circle, rgba(139,92,246,0.07) 0%, transparent 70%); animation-delay: -7s; }
    .particles span:nth-child(4) { width: 180px; height: 180px; top: 15%; right: 15%; background: radial-gradient(circle, rgba(124,92,224,0.05) 0%, transparent 70%); animation-delay: -10s; }
    .particles span:nth-child(5) { width: 80px; height: 80px; top: 40%; left: 35%; background: radial-gradient(circle, rgba(196,181,253,0.06) 0%, transparent 70%); animation-delay: -5s; }

    @keyframes float-particle {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-30px) scale(1.15); opacity: 1; }
    }

    /* ── Glow ring behind icon ── */
    .glow-ring {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .glow-ring::before {
      content: '';
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,92,224,0.15) 0%, transparent 70%);
      animation: glow-pulse 4s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* ── Content card ── */
    .content {
      position: relative;
      z-index: 1;
      max-width: 540px;
      text-align: center;
      background: rgba(15, 15, 25, 0.6);
      border: 1px solid rgba(124, 92, 224, 0.1);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), 0 0 80px rgba(124, 92, 224, 0.05);
    }

    .logo {
      width: 160px;
      margin-bottom: 0.5rem;
      opacity: 0.9;
      filter: drop-shadow(0 2px 8px rgba(124, 92, 224, 0.2));
    }

    .icon {
      width: 100px;
      height: 80px;
      color: #8b5cf6;
      filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.3));
      position: relative;
      z-index: 1;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #7c5ce0, transparent);
      border: none;
      border-radius: 2px;
      margin: 0 auto 1.5rem;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    .message {
      font-size: 0.95rem;
      color: #9ca3af;
      margin-bottom: 1.75rem;
      line-height: 1.7;
    }

    /* ── Status bar ── */
    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(124, 92, 224, 0.08);
      border: 1px solid rgba(124, 92, 224, 0.15);
      border-radius: 100px;
      padding: 8px 18px;
      margin-bottom: 2rem;
      font-size: 0.8rem;
      color: #6b7280;
      transition: all 0.3s;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: dot-blink 2s ease-in-out infinite;
    }
    .status-bar.checking { border-color: rgba(167, 139, 250, 0.3); color: #a78bfa; }
    .status-bar.checking .status-dot { background: #a78bfa; }
    .status-bar.back-online { border-color: rgba(52, 211, 153, 0.3); color: #34d399; }
    .status-bar.back-online .status-dot { background: #34d399; animation: none; }

    @keyframes dot-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Buttons ── */
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.7rem 1.5rem;
      background: linear-gradient(135deg, #7c5ce0 0%, #a78bfa 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 92, 224, 0.4);
    }
    .btn-primary:active { transform: translateY(0); }

    .btn-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ── Cloudflare diagnostic box ── */
    .cf-error-details {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      font-size: 0.75rem;
      color: #4b5563;
      line-height: 1.6;
      text-align: left;
    }

    /* ── Footer ── */
    .footer {
      position: relative;
      z-index: 1;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #4b5563;
    }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .content { padding: 2rem 1.5rem; margin: 0 0.5rem; }
      .title { font-size: 1.3rem; }
      .message { font-size: 0.9rem; }
      .logo { width: 130px; }
      .glow-ring::before { width: 120px; height: 120px; }
      .icon { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="content">
    <img src="https://rolespace.net/images/icon.png" alt="Rolespace" class="logo" />

    <div class="glow-ring">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
        <line x1="15" y1="13" x2="9" y2="19"/>
        <line x1="9" y1="13" x2="15" y2="19"/>
      </svg>
    </div>

    <hr class="divider" />

    <h1 class="title">Server Unavailable</h1>
    <p class="message">
      Our servers can't be reached right now. We're working on getting
      things back up and running. Please try again in a little while.
    </p>

    <div class="status-bar" id="statusBar">
      <span class="status-dot"></span>
      <span id="statusText">Retrying in <strong id="countdown">30</strong>s</span>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="location.reload()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Try Again
      </button>
    </div>

    <div class="cf-error-details">
      ::CLOUDFLARE_ERROR_500S_BOX::
    </div>
  </div>

  <div class="footer">Rolespace &mdash; Gaming &amp; Streaming Community</div>

  <script>
    (function() {
      var INTERVAL = 30;
      var remaining = INTERVAL;
      var countdownEl = document.getElementById('countdown');
      var statusBar = document.getElementById('statusBar');
      var statusText = document.getElementById('statusText');

      setInterval(function() {
        remaining--;
        if (remaining <= 0) {
          statusBar.className = 'status-bar checking';
          statusText.innerHTML = 'Reloading\u2026';
          location.reload();
          return;
        }
        if (countdownEl) countdownEl.textContent = remaining;
      }, 1000);
    })();
  </script>

</body>
</html>
